name: Build Almunjaz APK

on:
  push:
    branches:
      - build-almunjaz-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: android-webview-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp android-webview-app/app/build/outputs/apk/debug/app-debug.apk output/Almunjaz-AlSarie.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Almunjaz-AlSarie-APK
          path: output/Almunjaz-AlSarie.apk
          if-no-files-found: error
